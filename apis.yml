aid: perimeter-81
name: Perimeter 81
description: 'Perimeter 81 is a cloud-native Secure Access Service Edge (SASE) and Zero
  Trust Network Access (ZTNA) platform, now part of Check Point as Check Point Harmony
  SASE following its 2023 acquisition. It lets organizations build and manage secure,
  software-defined networks that connect a distributed workforce to on-premises resources,
  cloud infrastructure, and SaaS applications without legacy hardware appliances. The
  Harmony SASE Public API (v2.3) exposes programmatic control over networks, regions
  and points-of-presence, gateways, IPSec/WireGuard/OpenVPN tunnels, route tables,
  firewall policies, and network objects, using a two-step API-key-to-JWT access-token
  authentication model across US, EU, Australia, and India regional gateways.'
